services:
  web:
    build: .
    restart: unless-stopped
    # Forge writes the app's env vars/secrets to .env on deploy; inject them all.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
