services:
  web:
    build: .
    restart: unless-stopped
    # Forge writes the app's env vars/secrets to .env on deploy; inject them all.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    # Forge routes to the container over its internal network via target_port.
    # Use expose (not host-published ports) to avoid host port collisions.
    expose:
      - "3000"
